spring.application.name=asiou-conference-portal
server.port=8083

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/asiou_conference_portal
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=false

# JWT
app.jwt.secret=${JWT_SECRET:ZmFrZS1zZWNyZXQtc2VjcmV0LWJhc2U2NC1tdXN0LWJlLTMyLWJ5dGVzLWxvbmc=}
app.jwt.expiration-ms=3600000

# Admin Bootstrap
app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@asoiu.az}
app.bootstrap.admin.password=${ADMIN_PASSWORD:AdminPassword123!}
app.bootstrap.admin.firstName=${BOOTSTRAP_ADMIN_FIRST_NAME:System}
app.bootstrap.admin.lastName=${BOOTSTRAP_ADMIN_LAST_NAME:Admin}

logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security=DEBUG
logging.level.az.edu.asiouconferenceportal=DEBUG

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB