spring.application.name=asiou-conference-portal
server.port=8083

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/asiou_conference_portal}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true

# JWT
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=3600000

# Admin Bootstrap
app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.firstName=${BOOTSTRAP_ADMIN_FIRST_NAME:System}
app.bootstrap.admin.lastName=${BOOTSTRAP_ADMIN_LAST_NAME:Admin}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# File Storage
app.files.storageDir=${FILE_STORAGE_ROOT_LOCATION:./storage}

# CORS
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}

# Logging
logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.springframework.security=INFO
logging.level.az.edu.asiouconferenceportal=INFO

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true